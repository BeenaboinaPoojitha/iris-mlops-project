
name: Iris Model Retraining

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r iris_mlops_project/requirements.txt

      - name: Run model retraining
        working-directory: iris_mlops_project
        run: python retrain.py
